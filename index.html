<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House</title>

<!-- Include Fonts -->
<link href="https://googleapis.com" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    /* Rich dark canvas to make the lava lamp glow stand out */
    background: #09090d; 
    color: white;
    text-align: center;
    position: relative;
    overflow-x: hidden;
}

/* Lava Lamp Canvas Layer */
.lava-lamp-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
    /* Soft ambient vignetting for depth */
    background: radial-gradient(circle at 50% 50%, rgba(15, 15, 25, 0.5), #040406);
    filter: blur(55px); /* Heavy blur blends the shapes together like fluid wax */
}

/* Base glowing lava blob setup */
.blob {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff0055, #3399ff);
    background-size: 200% 200%;
    mix-blend-mode: screen;
    animation: rainbowShift 20s ease infinite;
}

/* Individual organic floating movements for each lava blob */
.blob-1 {
    width: 350px;
    height: 450px;
    left: 5%;
    top: 5%;
    animation: floatUpAndDown 24s ease-in-out infinite alternate, rainbowShift 18s ease infinite;
}

.blob-2 {
    width: 500px;
    height: 350px;
    right: 5%;
    bottom: -5%;
    animation: floatLeftToRight 30s ease-in-out infinite alternate, rainbowShift 24s ease infinite;
    opacity: 0.8;
}

.blob-3 {
    width: 260px;
    height: 260px;
    left: 40%;
    bottom: 15%;
    animation: floatUpAndDown 18s ease-in-out infinite alternate-reverse, rainbowShift 15s ease infinite;
    opacity: 0.7;
}

.blob-4 {
    width: 220px;
    height: 300px;
    right: 15%;
    top: 15%;
    animation: floatUpAndDown 20s ease-in-out infinite alternate, rainbowShift 22s ease infinite;
    opacity: 0.5;
}

.blob-5 {
    width: 320px;
    height: 240px;
    left: 20%;
    bottom: 45%;
    animation: floatLeftToRight 26s ease-in-out infinite alternate-reverse, rainbowShift 19s ease infinite;
    opacity: 0.6;
}

.blob-6 {
    width: 180px;
    height: 180px;
    right: 40%;
    top: 40%;
    animation: floatUpAndDown 14s ease-in-out infinite alternate, rainbowShift 13s ease infinite;
    opacity: 0.55;
}

/* Lava Lamp Floating Animations */
@keyframes floatUpAndDown {
    0% {
        transform: translateY(0px) scale(1) rotate(0deg);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    }
    50% {
        transform: translateY(160px) scale(1.12) rotate(90deg);
        border-radius: 60% 40% 50% 50% / 50% 60% 40% 60%;
    }
    100% {
        transform: translateY(-40px) scale(0.95) rotate(180deg);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    }
}

@keyframes floatLeftToRight {
    0% {
        transform: translateX(0px) translateY(0px) scale(1);
        border-radius: 50% 50% 30% 70% / 50% 60% 40% 50%;
    }
    50% {
        transform: translateX(-120px) translateY(-80px) scale(1.15);
        border-radius: 30% 70% 70% 30% / 60% 40% 60% 40%;
    }
    100% {
        transform: translateX(40px) translateY(40px) scale(0.95);
        border-radius: 50% 50% 30% 70% / 50% 60% 40% 50%;
    }
}

/* Fluid Rainbow Color Spectrum Loop */
@keyframes rainbowShift {
    0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
    50% { background-position: 100% 50%; filter: hue-rotate(180deg); }
    100% { background-position: 0% 50%; filter: hue-rotate(360deg); }
}

/* Header */
.header {
    margin-top: 30px;
}

.header h1 {
    margin: 5px;
    font-size: 85px; /* Bigger title */
    font-family: 'Syne', sans-serif; /* Popping Modern Bold Font Selection */
    font-weight: 800;
    letter-spacing: -2px;
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 8s linear infinite;
    /* Soft colorful drop shadow to make the letters jump off the screen */
    text-shadow: 0 0 30px rgba(255, 0, 85, 0.2); 
}

@keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
}

.header p {
    margin: 5px;
    font-size: 22px; /* Subtitle slightly bigger */
}

/* Main headings on page */
h3 {
    font-size: 32px; /* Bigger h3 headings */
    font-weight: 600;
}

/* Example images row */
.examples {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px;
}

.examples img {
    width: 90px; /* bigger animal example images */
    height: 90px;
    border-radius: 15px;
    object-fit: cover;
    transition: transform 0.3s ease; /* Makes the scaling smooth */
}

/* Example images get bigger when hovered */
.examples img:hover {
    transform: scale(1.12); /* Enlarges the image when pointed at */
}

/* Section title */
.section-title {
    font-size: 36px; /* Slightly bigger section title */
    margin-top: 20px;
}

/* Products */
.products {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.product img {
    width: 150px; /* bigger product images */
    height: 150px;
    border-radius: 20px;
    object-fit: cover;
    transition: transform 0.3s ease; /* Makes the scaling smooth */
}

/* Main product images get bigger when hovered */
.product img:hover {
    transform: scale(1.08); /* Enlarges the image when pointed at */
}

.product p {
    margin-top: 10px;
}

/* Big text */
.big-text {
    font-size: 40px; /* Bigger big text */
    font-weight: 600;
    margin: 20px 0;
}

/* Buttons */
.btn {
    display: inline-block;
    padding: 15px 25px; /* Slightly bigger buttons */
    margin: 10px;
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-family: 'Lexend', sans-serif;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* Visual Effects added on Button Hover */
.btn:hover {
    transform: translateY(-3px) scale(1.05); /* Slight lift and scale upward */
    box-shadow: 0 8px 25px rgba(255,255,255,0.2); /* Soft glow behind button */
    animation: buttonPulse 1s infinite alternate; /* Gentle continuous bounce animation */
}

/* Sleek lighting shine flash that passes over the button when hovered */
.btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -50%;
    width: 200%;
    height: 100%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-25deg);
    transition: 0.75s;
    opacity: 0;
}

.btn:hover::after {
    left: 125%;
    opacity: 1;
}

@keyframes buttonPulse {
    0% { transform: translateY(-3px) scale(1.05); }
    100% { transform: translateY(-6px) scale(1.07); }
}

/* Button colors */
.messenger {
    background: #0084ff;
}

.facebook {
    background: #1877f2;
}

/* Email text section matching your working copy */
.email {
    margin-top: 50px;
    margin-bottom: 40px;
    font-size: 24px;
}

/* Container for individual email lines to group text securely */
.email-row {
    display: inline-block;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Hover effect targets the entire text row */
.email-row:hover {
    transform: translateY(-4px) scale(1.04);
}

.email span, .email a {
    display: inline-block;
    font-weight: 600;
    text-decoration: none;
    background: linear-gradient(90deg, #ff0055, #ff9933, #ffff33, #00ffcc, #3399ff, #cc00ff, #ff0055);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 14s linear infinite; /* Slow rainbow color change */
    padding: 0 5px;
    transition: filter 0.3s ease;
}

/* Makes the text throw off a matching spectrum shadow glow when hovered */
.email-row:hover span, .email-row:hover a {
    filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.6));
}

/* Feedback section */
.feedback-section {
    margin-top: 50px;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    margin-left:auto;
    margin-right:auto;
}

.feedback-section h3 {
    margin-bottom: 15px;
    font-size: 28px;
}

.feedback-section input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    margin-bottom: 10px;
}

.feedback-section button {
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background:#0084ff;
    color:white;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    cursor:pointer;
}
</style>

</head>

</div>
