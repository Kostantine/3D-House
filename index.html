<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House</title>

<!-- Include Lexend font -->
<link href="https://googleapis.com" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    background: #000;
    color: white;
    text-align: center;
    position: relative;
    overflow-x: hidden;
}

/* Moving Space Background Canvas Layer */
#spaceCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
}

/* Content wrapper sitting safely over the stars */
.content-wrapper {
    position: relative;
    z-index: 1;
}

/* Header */
.header {
    margin-top: 30px;
}

.header h1 {
    margin: 5px;
    font-size: 85px; /* Bigger title */
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 8s linear infinite;
}

@keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
}

.header p {
    margin: 5px;
    font-size: 22px; /* Subtitle slightly bigger */
}

/* Main headings on page */
h3 {
    font-size: 32px; /* Bigger h3 headings */
    font-weight: 600;
}

/* Example images row */
.examples {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px;
}

.examples img {
    width: 90px; /* bigger animal example images */
    height: 90px;
    border-radius: 15px;
    object-fit: cover;
    transition: transform 0.3s ease; /* Makes the scaling smooth */
}

/* Example images get bigger when hovered */
.examples img:hover {
    transform: scale(1.12); /* Enlarges the image when pointed at */
}

/* Section title */
.section-title {
    font-size: 36px; /* Slightly bigger section title */
    margin-top: 20px;
}

/* Products */
.products {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.product img {
    width: 150px; /* bigger product images */
    height: 150px;
    border-radius: 20px;
    object-fit: cover;
    transition: transform 0.3s ease; /* Makes the scaling smooth */
}

/* Main product images get bigger when hovered */
.product img:hover {
    transform: scale(1.08); /* Enlarges the image when pointed at */
}

.product p {
    margin-top: 10px;
}

/* Big text */
.big-text {
    font-size: 40px; /* Bigger big text */
    font-weight: 600;
    margin: 20px 0;
}

/* Buttons and Links Container Setup for Fireworks */
.btn-container, .gmail-group-container {
    display: inline-block;
    position: relative;
    margin: 5px;
}

/* Unique wrapper to split the two Gmail elements and space them out vertically */
.gmail-group-container {
    display: block;
    margin: 15px auto;
    font-size: 22px;
    width: fit-content;
}

/* Spacing out the first block down from the text above, and away from the block below */
.space-down {
    margin-top: 45px;
    margin-bottom: 40px; /* Moves the second email down significantly */
}

/* Specific styling for the text inside the Gmail group */
.gmail-group-container .gmail-label, 
.gmail-group-container a {
    display: inline-block;
    vertical-align: middle;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    transition: transform 0.3s ease;
    text-decoration: none;
    padding: 6px 5px;
    
    /* Smooth, slow rainbow animation for the text labels and the links */
    background: linear-gradient(90deg, #ff0055, #ff9933, #ffff33, #00ffcc, #3399ff, #cc00ff, #ff0055);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 14s linear infinite; /* Wonderfully slow color change */
}

/* Extra side spacing on link specifically */
.gmail-group-container a {
    padding-left: 10px;
}

/* Buttons */
.btn {
    display: inline-block;
    padding: 15px 25px; /* Slightly bigger buttons */
    margin: 10px;
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-family: 'Lexend', sans-serif;
    position: relative;
    z-index: 2;
    transition: transform 0.3s ease;
}

/* Button colors */
.messenger {
    background: #0084ff;
}

.facebook {
    background: #1877f2;
}

/* General Hover Scale for Buttons and Entire Gmail Row Groups together */
.btn-container:hover .btn,
.gmail-group-container:hover .gmail-label,
.gmail-group-container:hover a {
    transform: scale(1.10); /* Zooms both 'Gmail:' and the link at the exact same time */
}

/* Multi-Stage Fireworks setup using pseudo-elements */
.btn-container::before, .btn-container::after,
.gmail-group-container::before, .gmail-group-container::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
}

/* Firework Phase 1: High flying primary dots (Runs for exactly 3 seconds total) */
.btn-container:hover::before, .gmail-group-container:hover::before {
    animation: firework-stage-1 0.75s cubic-bezier(0.1, 0.8, 0.3, 1);
    animation-iteration-count: 4; /* 0.75s * 4 = Exactly 3 seconds */
}

/* Firework Phase 2: Shattering mini secondary sparks bursting outward (Runs for exactly 3 seconds total) */
.btn-container:hover::after, .gmail-group-container:hover::after {
    animation: firework-stage-2 0.75s cubic-bezier(0.1, 0.6, 0.2, 1);
    animation-delay: 0.15s;
    animation-iteration-count: 4;
}

/* Stage 1 Animation: Spreads far out into the air as bright round dots */
@keyframes firework-stage-1 {
    0% {
        box-shadow: 
            0 0 #ff0055, 0 0 #00ffcc, 0 0 #ffcc00, 0 0 #9900ff,
            0 0 #ff5500, 0 0 #00ff00, 0 0 #0066ff, 0 0 #cc00ff;
        opacity: 1;
        transform: scale(1);
    }
    40% {
        opacity: 1;
    }
    100% {
        box-shadow: 
            -150px -90px 4px #ff0055, 150px -90px 4px #00ffcc, -150px 90px 4px #ffcc00, 150px 90px 4px #9900ff,
            -180px 0px 4px #ff5500, 180px 0px 4px #00ff00, 0px -180px 4px #0066ff, 0px 180px 4px #cc00ff;
        opacity: 0;
        transform: scale(1.6);
    }
}

/* Stage 2 Animation: Explodes instantly into a multiplying wave of dense bright micro-sparks */
@keyframes firework-stage-2 {
    0% {
        box-shadow: 
            0 0 #00ffff, 0 0 #ff00ff, 0 0 #ffff00, 0 0 #ff3300,
            0 0 #33ff00, 0 0 #0033ff, 0 0 #e60073, 0 0 #ff9900;
        opacity: 0;
        transform: scale(0.5);
    }
    20% {
        opacity: 1;
    }
    100% {
        box-shadow: 
            -110px -130px 2px #00ffff, 110px -130px 2px #ff00ff, -130px 110px 2px #ffff00, 130px 110px 2px #ff3300,
            -130px -110px 2px #33ff00, 130px -110px 2px #0033ff, -110px 130px 2px #e60073, 110px 130px 2px #ff9900,
            -125px -125px 2px #ff0055, 125px -125px 2px #00ffcc, -125px 125px 2px #ffcc00, 125px 125px 2px #9900ff,
            -145px -60px 1px #ffff00, 145px 60px 1px #ff00ff, -60px 145px 1px #00ffff, 60px -145px 1px #ff3300;
        opacity: 0;
        transform: scale(2.3);
    }
}

/* Feedback section */
.feedback-section {
    margin-top: 50px;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    margin-left:auto;
    margin-right:auto;
    backdrop-filter: blur(4px); /* Clean frosted glass effect over space warp */
}

.feedback-section h3 {
    margin-bottom: 15px;
    font-size: 28px;
}

.feedback-section input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    margin-bottom: 10px;
}

.feedback-section button {
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background:#0084ff;
    color:white;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    cursor:pointer;
}
</style>

</head>
