<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House Store</title>

<!-- Include Lexend font -->
<link href="https://googleapis.com" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    background-color: #03030c; /* Deep space dark backdrop */
    min-height: 100vh;
}

body {
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    color: white;
    text-align: center;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto; /* Lets the page scroll naturally to prevent layout cut-off */
}

/* HIGH VISIBILITY LAVA LAMP BACKGROUND LAYER */
#spaceCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1; /* Sits directly on top of the black background */
    pointer-events: none; /* Allows cursor to click links underneath smoothly */
}

/* MAIN LAYOUT CONTAINER */
.content-wrapper {
    position: relative;
    z-index: 10; /* Floating safely on top of the background canvas */
    background: transparent !important;
    padding-bottom: 60px; /* Extra room at the very bottom */
    
    /* Cinematic Entrance: Page lifts up from the bottom while fading in beautifully */
    opacity: 0;
    transform: translateY(60px);
    animation: entranceRiseUp 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    animation-delay: 0.1s; 
}

@keyframes entranceRiseUp {
    0% {
        opacity: 0;
        transform: translateY(60px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Header */
.header {
    margin-top: 30px;
}

.header h1 {
    margin: 5px;
    font-size: 85px; /* Bigger title */
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 8s linear infinite;
}

@keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
}

.header p {
    margin: 5px;
    font-size: 22px; 
}

h3 {
    font-size: 32px; 
    font-weight: 600;
}

.examples {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px;
}

.examples img {
    width: 90px; 
    height: 90px;
    border-radius: 15px;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.examples img:hover {
    transform: scale(1.12); /* Image scales up on hover */
}

.section-title {
    font-size: 36px;
    margin-top: 20px;
}

.products {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.product img {
    width: 150px; 
    height: 150px;
    border-radius: 20px;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.product img:hover {
    transform: scale(1.08); /* Product image scales up on hover */
}

.product p {
    margin-top: 10px;
}

.big-text {
    font-size: 40px;
    font-weight: 600;
    margin: 20px 0;
}

/* Button and Gmail container layout wrapping */
.btn-container, .gmail-group-container {
    display: inline-block;
    position: relative;
    margin: 10px;
}

.gmail-group-container {
    display: block;
    margin: 15px auto;
    font-size: 22px;
    width: fit-content;
}

.space-down {
    margin-top: 45px;
    margin-bottom: 40px; /* Spacing out the two Gmail slots vertically */
}

/* Buttons styling */
.btn {
    display: inline-block;
    padding: 15px 25px; 
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-family: 'Lexend', sans-serif;
    position: relative;
    z-index: 12;
    transition: transform 0.3s ease;
}

.messenger {
    background: #0084ff;
}

.facebook {
    background: #1877f2;
}

/* Specific styling for the text inside the Gmail group */
.gmail-group-container .gmail-label, 
.gmail-group-container a {
    display: inline-block;
    vertical-align: middle;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    transition: transform 0.3s ease;
    text-decoration: none;
    padding: 6px 5px;
    
    /* Smooth, slow rainbow animation for the text labels and the links */
    background: linear-gradient(90deg, #ff0055, #ff9933, #ffff33, #00ffcc, #3399ff, #cc00ff, #ff0055);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 14s linear infinite; 
}

.gmail-group-container a {
    padding-left: 10px;
}

/* CUSTOM ZOOM ANIMATION */
.btn-container:hover .btn,
.gmail-group-container:hover .gmail-label,
.gmail-group-container:hover a {
    transform: scale(1.10); /* Smoothly zooms text and labels larger together */
}

/* ORIGINAL FIREWORKS METHOD: Popping particle stars explosion directly out from the nodes */
.btn-container::before, .btn-container::after,
.gmail-group-container::before, .gmail-group-container::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
}

/* Spark layer 1 (Popping particle stars loop) */
.btn-container:hover::before, .gmail-group-container:hover::before {
    animation: original-pop-1 0.75s cubic-bezier(0.1, 0.8, 0.3, 1);
    animation-iteration-count: 4; /* Clears out at exactly 3 seconds */
}

/* Spark layer 2 (Multiplying particle stars loop) */
.btn-container:hover::after, .gmail-group-container:hover::after {
    animation: original-pop-2 0.75s cubic-bezier(0.1, 0.6, 0.2, 1);
    animation-delay: 0.15s;
    animation-iteration-count: 4; /* Clears out at exactly 3 seconds */
}

@keyframes original-pop-1 {
    0% {
        box-shadow: 0 0 #ff0055, 0 0 #00ffcc, 0 0 #ffcc00, 0 0 #9900ff, 0 0 #ff5500, 0 0 #00ff00, 0 0 #0066ff, 0 0 #cc00ff;
        opacity: 1; transform: scale(1);
    }
    100% {
        box-shadow: -140px -90px 4px #ff0055, 140px -90px 4px #00ffcc, -140px 90px 4px #ffcc00, 140px 90px 4px #9900ff, -160px 0px 4px #ff5500, 160px 0px 4px #00ff00, 0px -160px 4px #0066ff, 0px 160px 4px #cc00ff;
        opacity: 0; transform: scale(1.6);
    }
}

@keyframes original-pop-2 {
    0% {
        box-shadow: 0 0 #00ffff, 0 0 #ff00ff, 0 0 #ffff00, 0 0 #ff3300, 0 0 #33ff00, 0 0 #0033ff, 0 0 #e60073, 0 0 #ff9900;
        opacity: 0; transform: scale(0.5);
    }
    20% { opacity: 1; }
    100% {
        box-shadow: -110px -130px 2px #00ffff, 110px -130px 2px #ff00ff, -130px 110px 2px #ffff00, 130px 110px 2px #ff3300, -130px -110px 2px #33ff00, 130px -110px 2px #0033ff, -110px 130px 2px #e60073, 110px 130px 2px #ff9900, -125px -125px 2px #ff0055, 125px -125px 2px #00ffcc, -125px 125px 2px #ffcc00, 125px 125px 2px #9900ff, -145px -60px 1px #ffff00, 145px 60px 1px #ff00ff, -60px 145px 1px #00ffff, 60px -145px 1px #ff3300;
        opacity: 0; transform: scale(2.3);
    }
}

/* Feedback section */
.feedback-section {
    margin-top: 50px;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    margin-left:auto;
    margin-right:auto;
    backdrop-filter: blur(4px); /* Clean glass panel backing effect */
}

.feedback-section h3 {
    margin-bottom: 15px;
    font-size: 28px;
}

.feedback-section input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    margin-bottom: 10px;
}

.feedback-section button {
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background:#0084ff;
    color:white;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    cursor:pointer;
}
</style>
</head>
