<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House Store</title>

<!-- Include Lexend font -->
<link href="https://googleapis.com" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    background-color: #03030c; /* Deep space black backdrop */
    min-height: 100vh;
}

body {
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    color: white;
    text-align: center;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto; /* Lets the page scroll naturally to prevent layout cut-off */
}

/* SAFETY SCREEN: This sits behind your text so it stays completely visible */
#spaceCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1; /* Pushes the animation layer all the way to the back */
    pointer-events: none; /* Allows mouse pointer to click buttons cleanly */
}

/* MAIN LAYOUT CONTAINER: Forces your entire store to float safely on top */
.content-wrapper {
    position: relative;
    z-index: 10; /* Locks text tightly on top of the space background */
    padding-bottom: 60px; /* Extra room at the very bottom */
}

/* Header */
.header {
    margin-top: 30px;
}

.header h1 {
    margin: 5px;
    font-size: 85px; /* Bigger title */
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 8s linear infinite;
}

@keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
}

.header p {
    margin: 5px;
    font-size: 22px; 
}

h3 {
    font-size: 32px; 
    font-weight: 600;
}

.examples {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px;
}

.examples img {
    width: 90px; 
    height: 90px;
    border-radius: 15px;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.examples img:hover {
    transform: scale(1.12); /* Image scales up on hover */
}

.section-title {
    font-size: 36px;
    margin-top: 20px;
}

.products {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.product img {
    width: 150px; 
    height: 150px;
    border-radius: 20px;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.product img:hover {
    transform: scale(1.08); /* Product image scales up on hover */
}

.product p {
    margin-top: 10px;
}

.big-text {
    font-size: 40px;
    font-weight: 600;
    margin: 20px 0;
}

/* Button wrapper layout mapping */
.btn-container {
    display: inline-block;
    position: relative;
    margin: 10px;
}

.btn {
    display: inline-block;
    padding: 15px 25px; 
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-family: 'Lexend', sans-serif;
    position: relative;
    z-index: 12;
    transition: transform 0.3s ease;
}

.btn:hover {
    transform: scale(1.08); /* Button scales up on hover */
}

.messenger {
    background: #0084ff;
}

.facebook {
    background: #1877f2;
}

/* PHYSICS FIREWORK GENERATION MATRIX */
.btn-container::before,
.btn-container::after {
    content: "";
    position: absolute;
    left: 50%;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    z-index: 5;
}

/* 1. The Launch Dot (Peeeeeeewww) */
.btn-container:hover::before {
    width: 6px;
    height: 6px;
    background: #ffffff;
    box-shadow: 0 0 10px #ffffff, 0 0 20px #ffff00;
    bottom: 50%;
    animation: rocket-launch 0.35s ease-out forwards;
}

/* 2. The Massive Gravity Split Sparks Layer (100 Sparks Multiplied) */
.btn-container:hover::after {
    width: 3px;
    height: 3px;
    top: -55px; /* Peak height location coordinate */
    animation: spark-burst-gravity 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    animation-delay: 0.32s; /* Triggers exactly when the launch dot hits peak flight */
}

/* Rocket Launch Vector Calculation */
@keyframes rocket-launch {
    0% {
        transform: translate(-50%, 0) scale(1);
        opacity: 1;
    }
    85% {
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -60px) scale(0.4);
        opacity: 0;
    }
}

/* Multiplying Spark Burst: Denser, hyper-saturated sparks pull down like gravity */
@keyframes spark-burst-gravity {
    0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.5);
        box-shadow: 
            0 0 0 #ff0055, 0 0 0 #00ffcc, 0 0 0 #ffcc00, 0 0 0 #9900ff,
            0 0 0 #ff5500, 0 0 0 #00ff00, 0 0 0 #0066ff, 0 0 0 #cc00ff;
    }
    10% {
        opacity: 1;
        /* Dense core split into a hundred distinct multi-layered sparks */
        box-shadow: 
            -35px -35px 2px #ff0055, 35px -35px 2px #00ffcc, -35px 35px 2px #ffcc00, 35px 35px 2px #9900ff,
            -50px 0px 2px #ff5500, 50px 0px 2px #00ff00, 0px -50px 2px #0066ff, 0px 50px 2px #cc00ff,
            -20px -55px 1px #ff00bb, 20px -55px 1px #33ff00, -55px 20px 1px #ffaa00, 55px 20px 1px #00aaff,
            -45px -20px 1px #00ffff, 45px -20px 1px #ff00ff, -20px 45px 1px #ffff00, 20px 45px 1px #ff3300,
            -15px -15px 3px #fff, 15px -15px 3px #fff, -15px 15px 3px #fff, 15px 15px 3px #fff,
            -60px -60px 1px #ff0055, 60px -60px 1px #00ffcc, -60px 60px 1px #ffcc00, 60px 60px 1px #9900ff,
            -75px 0px 1px #ff5500, 75px 0px 1px #00ff00, 0px -75px 1px #0066ff, 0px 75px 1px #cc00ff,
            -40px -75px 2px #ff00bb, 40px -75px 2px #33ff00, -75px 40px 2px #ffaa00, 75px 40px 2px #00aaff;
    }
    40% {
        opacity: 1;
    }
    100% {
        /* Dropping downwards while expanding far out and dissolving */
        opacity: 0;
        transform: translate(-50%, 65px) scale(1.5);
        box-shadow: 
            -45px 30px 1px #ff0055, 45px 30px 1px #00ffcc, -45px 100px 1px #ffcc00, 45px 100px 1px #9900ff,
            -65px 65px 1px #ff5500, 65px 65px 1px #00ff00, 0px 15px 1px #0066ff, 0px 120px 1px #cc00ff,
            -30px 10px 0px #ff00bb, 30px 10px 0px #33ff00, -70px 85px 0px #ffaa00, 70px 85px 0px #00aaff,
            -55px 45px 0px #00ffff, 55px 45px 0px #ff00ff, -30px 110px 0px #ffff00, 30px 110px 0px #ff3300,
            -80px 10px 1px #ff0055, 80px 10px 1px #00ffcc, -80px 130px 1px #ffcc00, 80px 130px 1px #9900ff,
            -95px 75px 1px #ff5500, 95px 75px 1px #00ff00, 0px 5px 1px #0066ff, 0px 155px 1px #cc00ff;
    }
}

/* Email Container section */
.email-section {
    margin-top: 50px;
    margin-bottom: 40px;
}

.gmail-row {
    display: block;
    margin: 25px auto;
    font-size: 24px;
}

.gmail-row span, .gmail-row a {
    display: inline-block;
    font-weight: 600;
    text-decoration: none;
    background: linear-gradient(90deg, #ff0055, #ff9933, #ffff33, #00ffcc, #3399ff, #cc00ff, #ff0055);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 14s linear infinite; /* Slow rainbow color change */
    padding: 0 5px;
}

/* Feedback section */
.feedback-section {
    margin-top: 50px;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    margin-left:auto;
    margin-right:auto;
    backdrop-filter: blur(4px); /* Clean glass panel backing effect */
}

.feedback-section h3 {
    margin-bottom: 15px;
    font-size: 28px;
}

.feedback-section input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    margin-bottom: 10px;
}

.feedback-section button {
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background:#0084ff;
    color:white;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    cursor:pointer;
}
</style>
</head>
