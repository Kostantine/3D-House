<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House</title>

<!-- Include Lexend font -->
<link href="https://googleapis.com" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    background: linear-gradient(to bottom, #2c2c2c, #000);
    color: white;
    text-align: center;
}

/* Header */
.header {
    margin-top: 30px;
}

.header h1 {
    margin: 5px;
    font-size: 85px; /* Bigger title */
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 8s linear infinite;
}

@keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
}

.header p {
    margin: 5px;
    font-size: 22px; /* Subtitle slightly bigger */
}

/* Main headings on page */
h3 {
    font-size: 32px; /* Bigger h3 headings */
    font-weight: 600;
}

/* Example images row */
.examples {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px;
}

.examples img {
    width: 90px; /* bigger animal example images */
    height: 90px;
    border-radius: 15px;
    object-fit: cover;
    transition: transform 0.3s ease; /* Makes the scaling smooth */
}

/* Example images get bigger when hovered */
.examples img:hover {
    transform: scale(1.12); /* Enlarges the image when pointed at */
}

/* Section title */
.section-title {
    font-size: 36px; /* Slightly bigger section title */
    margin-top: 20px;
}

/* Products */
.products {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.product img {
    width: 150px; /* bigger product images */
    height: 150px;
    border-radius: 20px;
    object-fit: cover;
    transition: transform 0.3s ease; /* Makes the scaling smooth */
}

/* Main product images get bigger when hovered */
.product img:hover {
    transform: scale(1.08); /* Enlarges the image when pointed at */
}

.product p {
    margin-top: 10px;
}

/* Big text */
.big-text {
    font-size: 40px; /* Bigger big text */
    font-weight: 600;
    margin: 20px 0;
}

/* Buttons and Links Container Setup for Fireworks */
.btn-container, .gmail-link-wrapper {
    display: inline-block;
    position: relative;
}

/* Buttons */
.btn {
    display: inline-block;
    padding: 15px 25px; /* Slightly bigger buttons */
    margin: 10px;
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-family: 'Lexend', sans-serif;
    position: relative;
    z-index: 2;
    transition: transform 0.3s ease;
}

/* Button colors */
.messenger {
    background: #0084ff;
}

.facebook {
    background: #1877f2;
}

/* Email text */
.email {
    margin-top: 15px;
    font-size: 18px;
}

.email a {
    color: #ffffff;
    text-decoration: none;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    display: inline-block;
    position: relative;
    z-index: 2;
    transition: transform 0.3s ease;
    margin: 4px 0;
}

/* General Hover Scale for Buttons and Gmails */
.btn-container:hover .btn,
.gmail-link-wrapper:hover a {
    transform: scale(1.08);
}

/* Create the Firework Burst Effect using pseudo-elements */
.btn-container::before, .btn-container::after,
.gmail-link-wrapper::before, .gmail-link-wrapper::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
}

/* Firework layer 1 (Primary colors spark burst) */
.btn-container:hover::before, .gmail-link-wrapper:hover::before {
    animation: firework-burst-1 0.6s ease-out infinite;
}

/* Firework layer 2 (Secondary colors spark burst) */
.btn-container:hover::after, .gmail-link-wrapper:hover::after {
    animation: firework-burst-2 0.6s ease-out infinite;
    animation-delay: 0.2s;
}

/* Firework Particle Vectors */
@keyframes firework-burst-1 {
    0% {
        box-shadow: 
            0 0 #ff0055, 0 0 #00ffcc, 0 0 #ffcc00, 0 0 #9900ff,
            0 0 #ff5500, 0 0 #00ff00, 0 0 #0066ff, 0 0 #cc00ff;
        opacity: 1;
    }
    100% {
        box-shadow: 
            -40px -40px #ff0055, 40px -40px #00ffcc, -40px 40px #ffcc00, 40px 40px #9900ff,
            -60px 0px #ff5500, 60px 0px #00ff00, 0px -60px #0066ff, 0px 60px #cc00ff;
        opacity: 0;
        transform: scale(1.4);
    }
}

@keyframes firework-burst-2 {
    0% {
        box-shadow: 
            0 0 #00ffff, 0 0 #ff00ff, 0 0 #ffff00, 0 0 #ff3300,
            0 0 #33ff00, 0 0 #0033ff, 0 0 #9900ff, 0 0 #ff0066;
        opacity: 1;
    }
    100% {
        box-shadow: 
            -25px -50px #00ffff, 25px -50px #ff00ff, -50px 25px #ffff00, 50px 25px #ff3300,
            -50px -25px #33ff00, 50px -25px #0033ff, -25px 50px #9900ff, 25px 50px #ff0066;
        opacity: 0;
        transform: scale(1.2);
    }
}

/* Feedback section */
.feedback-section {
    margin-top: 50px;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    margin-left:auto;
    margin-right:auto;
}

.feedback-section h3 {
    margin-bottom: 15px;
    font-size: 28px;
}

.feedback-section input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    margin-bottom: 10px;
}

.feedback-section button {
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background:#0084ff;
    color:white;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    cursor:pointer;
}
</style>

</head>
<body>

<!-- Header -->
<div class="header">
    <h1>3D HOUSE</h1>
    <p>Where YOUR prints come to life!</p>
</div>

<h3>Examples of what we print!</h3>

<!-- Small Images -->
<div class="examples">
    <img src="dog.jpg">
    <img src="cat.jpg">
    <img src="snail.jpg">
    <img src="seal.jpg">
    <img src="axolotl.jpg">
</div>

<h2 class="section-title">Animals</h2>

<!-- Products -->
<div class="products">
    <div class="product">
        <img src="stand.jpg">
        <p>Headphone Stands</p>
    </div>

    <div class="product">
        <img src="shelf.jpg">
        <p>Mini Shelves</p>
    </div>

    <div class="product">
        <img src="oreo.jpg">
        <p>Magnet Fidgets</p>
    </div>
</div>

<div class="big-text">And More!</div>

<h3>CREATE YOUR 3D PRINT HERE!</h3>
<p>Contact us here!<br>And get your prints!</p>

<div class="btn-container">
    <a href="https://messenger.com" target="_blank" class="btn messenger">Messenger</a>
</div>
<div class="btn-container">
    <a href="https://facebook.com" target="_blank" class="btn facebook">Facebook</a>
</div>

<!-- Updated Email Section -->
<p class="email">
    Gmail: 
    <span class="gmail-link-wrapper">
        <a href="https://google.com" target="_blank">konstantinezedgina@gmail.com</a>
    </span><br>
    <span class="gmail-link-wrapper">
        <a href="https://google.com" target="_blank">demezedginidze@gmail.com</a>
    </span>
</p>

<!-- Feedback Section -->
<div class="feedback-section">
    <h3>Feedback</h3>
    
    <!-- Form using Formspree -->
    <form action="https://formspree.io" method="POST">
        <input type="text" name="message" placeholder="Type your feedback here..." required>
        <button type="submit">Send</button>
    </form>
</div>

</body>
</html>
