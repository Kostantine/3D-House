<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House Store</title>

<!-- Include Lexend font -->
<link href="https://googleapis.com" rel="stylesheet">

<style>
/* Reset base browser parameters safely */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background-color: #03030c; /* Deep space dark backdrop void */
}

body {
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    color: white;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto; /* Allows natural scrolling downwards */
}

/* HIGH VISIBILITY BACKGROUND CANVAS: Forced to stretch 100% to prevent blank screens */
#spaceCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1; /* Pushes shapes directly behind structural storefront code layout */
    pointer-events: none; /* Crucial: Allows clicks to pass through to the buttons beneath */
    display: block;
}

/* TOTAL WEBPAGE CONTENT WRAPPER: Centers layout and prevents feedback container loss */
.main-container {
    position: relative;
    z-index: 10; /* Locked tightly on top of the moving lava bubbles */
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding-bottom: 80px; /* Massive bottom cushion padding so feedback form never cuts off */
    box-sizing: border-box;
    
    /* Cinematic Intro Entrance: Clean, centered slide up animation sequence */
    opacity: 0;
    animation: layoutEntranceRise 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    animation-delay: 0.15s;
}

/* Center-locked vertical slide rise mechanics */
@keyframes layoutEntranceRise {
    0% {
        opacity: 0;
        transform: translateY(70px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Header Section - Explicitly centered horizontally */
.header {
    margin-top: 40px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.header h1 {
    margin: 5px 0;
    font-size: 85px; 
    text-align: center;
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 8s linear infinite;
    width: auto;
}

@keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
}

.header p {
    margin: 10px 0;
    font-size: 22px; 
    text-align: center;
}

h3 {
    font-size: 32px; 
    font-weight: 600;
    margin-top: 40px;
}

/* Image showcase grids mapping */
.examples {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px auto;
}

.examples img {
    width: 90px; 
    height: 90px;
    border-radius: 15px;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.examples img:hover {
    transform: scale(1.12); /* Image scales up on hover */
}

.section-title {
    font-size: 36px;
    margin-top: 30px;
}

.products {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.product img {
    width: 150px; 
    height: 150px;
    border-radius: 20px;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.product img:hover {
    transform: scale(1.08); /* Product image scales up on hover */
}

.product p {
    margin-top: 10px;
}

.big-text {
    font-size: 40px;
    font-weight: 600;
    margin: 35px 0;
}

/* Button & Link layout block specifications */
.btn-container, .gmail-group-container {
    display: inline-block;
    position: relative;
    margin: 10px;
}

.gmail-group-container {
    display: block;
    margin: 20px auto;
    font-size: 22px;
    width: fit-content;
}

.space-down {
    margin-top: 55px;
    margin-bottom: 40px; /* Creates clean spacing down to the second block layout */
}

/* Buttons formatting styling */
.btn {
    display: inline-block;
    padding: 15px 25px; 
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-family: 'Lexend', sans-serif;
    position: relative;
    z-index: 12;
    transition: transform 0.3s ease;
}

.messenger {
    background: #0084ff;
}

.facebook {
    background: #1877f2;
}

/* Gmail links customized specifications layout mapping */
.gmail-group-container .gmail-label, 
.gmail-group-container a {
    display: inline-block;
    vertical-align: middle;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    transition: transform 0.3s ease;
    text-decoration: none;
    padding: 6px 5px;
    
    /* Smooth, slow rainbow animation for the text labels and the links */
    background: linear-gradient(90deg, #ff0055, #ff9933, #ffff33, #00ffcc, #3399ff, #cc00ff, #ff0055);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 14s linear infinite; 
}

.gmail-group-container a {
    padding-left: 10px;
}

/* CUSTOM ZOOM ANIMATION: Activates on user cursor interactions */
.btn-container:hover .btn,
.gmail-group-container:hover .gmail-label,
.gmail-group-container:hover a {
    transform: scale(1.10); /* Elements expand smoothly together */
}

/* ORIGINAL FIREWORKS METHOD: Explodes directly out from the elements core nodes */
.btn-container::before, .btn-container::after,
.gmail-group-container::before, .gmail-group-container::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
}

/* Spark layer 1 (Popping particle stars loop) */
.btn-container:hover::before, .gmail-group-container:hover::before {
    animation: original-pop-1 0.75s cubic-bezier(0.1, 0.8, 0.3, 1);
    animation-iteration-count: 4; /* Clears out at exactly 3 seconds */
}

/* Spark layer 2 (Multiplying particle stars loop) */
.btn-container:hover::after, .gmail-group-container:hover::after {
    animation: original-pop-2 0.75s cubic-bezier(0.1, 0.6, 0.2, 1);
    animation-delay: 0.15s;
    animation-iteration-count: 4; /* Clears out at exactly 3 seconds */
}

@keyframes original-pop-1 {
    0% {
        box-shadow: 0 0 #ff0055, 0 0 #00ffcc, 0 0 #ffcc00, 0 0 #9900ff, 0 0 #ff5500, 0 0 #00ff00, 0 0 #0066ff, 0 0 #cc00ff;
        opacity: 1; transform: scale(1);
    }
    100% {
        box-shadow: -140px -90px 4px #ff0055, 140px -90px 4px #00ffcc, -140px 90px 4px #ffcc00, 140px 90px 4px #9900ff, -160px 0px 4px #ff5500, 160px 0px 4px #00ff00, 0px -160px 4px #0066ff, 0px 160px 4px #cc00ff;
        opacity: 0; transform: scale(1.6);
    }
}

@keyframes original-pop-2 {
    0% {
        box-shadow: 0 0 #00ffff, 0 0 #ff00ff, 0 0 #ffff00, 0 0 #ff3300, 0 0 #33ff00, 0 0 #0033ff, 0 0 #e60073, 0 0 #ff9900;
        opacity: 0; transform: scale(0.5);
    }
    20% { opacity: 1; }
    100% {
        box-shadow: -110px -130px 2px #00ffff, 110px -130px 2px #ff00ff, -130px 110px 2px #ffff00, 130px 110px 2px #ff3300, -130px -110px 2px #33ff00, 130px -110px 2px #0033ff, -110px 130px 2px #e60073, 110px 130px 2px #ff9900, -125px -125px 2px #ff0055, 125px -125px 2px #00ffcc, -125px 125px 2px #ffcc00, 125px 125px 2px #9900ff, -145px -60px 1px #ffff00, 145px 60px 1px #ff00ff, -60px 145px 1px #00ffff, 60px -145px 1px #ff3300;
        opacity: 0; transform: scale(2.3);
    }
}

/* Feedback card module mapping */
.feedback-section {
    margin-top: 60px;
    padding: 25px;
    background: rgba(255,255,255,0.04);
    border-radius: 20px;
    width: 90%;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(5px); /* Premium frosted pane effect */
    box-sizing: border-box;
}

.feedback-section h3 {
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 28px;
}

.feedback-section input[type="text"] {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    margin-bottom: 15px;
    box-sizing: border-box;
}

.feedback-section button {
    padding: 12px 30px;
    border-radius: 25px;
    border: none;
    background: #0084ff;
    color: white;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease;
}

.feedback-section button:hover {
    transform: scale(1.05);
}
</style>
</head>
